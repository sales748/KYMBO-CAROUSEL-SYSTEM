<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weight, not intelligence · bar</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  :root{
    --paper:#FFFFFF; --paper-2:#F1F3F6; --ink:#262B38;
    --muted:rgba(38,43,56,.60); --line:rgba(38,43,56,.13);
    --accent:#9BEC00; --accent-tint:rgba(155,236,0,.18);
    --sans:'Satoshi','Onest Variable',system-ui,sans-serif;
    --mono:'JetBrains Mono','JetBrains Mono Variable',ui-monospace,monospace;
  }
  html,body{ background:var(--paper); }
  .slide{
    position:relative; width:1080px; height:1350px; overflow:hidden;
    padding:148px 92px 86px; font-family:var(--sans); color:var(--ink);
    display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  /* spec-paper grid — same as kymbo slides */
  .slide::before{
    content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
    background-image: radial-gradient(circle, rgba(38,43,56,.10) 1px, transparent 1.4px);
    background-size:24px 24px;
  }
  .slide::after{
    content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
    background:
      linear-gradient(to right, transparent 91px, rgba(38,43,56,.06) 91px, rgba(38,43,56,.06) 92px, transparent 92px),
      linear-gradient(to right, transparent 988px, rgba(38,43,56,.06) 988px, rgba(38,43,56,.06) 989px, transparent 989px);
  }
  .slide > *{ position:relative; z-index:1; }

  .diagram-frame{
    display:flex; flex-direction:column; gap:20px; margin-top:8px;
  }
  .eyebrow{
    font-family:var(--mono); font-size:22px; font-weight:500;
    letter-spacing:.18em; text-transform:uppercase; color:var(--muted);
  }
  svg{ width:100%; display:block; }

  .body{
    margin-top:auto; padding-top:44px; padding-bottom:34px;
    display:flex; flex-direction:column; gap:24px;
  }
  h1{
    font-size:74px; font-weight:800; letter-spacing:-.025em; line-height:1.02;
    max-width:900px; text-wrap:balance;
  }
  h1 .hi{ color:var(--ink); background:var(--accent); padding:.02em .18em; }
  .sub{
    font-size:36px; color:var(--muted); line-height:1.28;
    max-width:820px; text-wrap:pretty;
  }
  .cite{
    font-family:var(--mono); font-size:18px; letter-spacing:.06em;
    color:var(--muted); margin-top:8px;
  }
  .ft{ display:flex; align-items:center; gap:9px; margin-top:16px; }
  .tick{ width:14px; height:14px; background:var(--line); }
  .tick.on{ background:var(--accent); }
</style>
</head>
<body>
<div class="slide">
  <div class="diagram-frame">
    <div class="eyebrow">The cost · JavaScript payload</div>
    <!-- Bar chart: 6 features, 3 pairs (AI vs boring alternative).
         Height encodes typical bundle weight (order-of-magnitude, not exact).
         Verde accent = 1 focal bar (the largest offender). -->
    <svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d-title d-desc">
      <title id="d-title">JavaScript weight, AI features vs their boring alternatives</title>
      <desc id="d-desc">Bar chart comparing typical payload weight of three common 'AI features' against the boring, low-weight alternatives they replace. The AI chat widget is the largest.</desc>

      <!-- gridlines -->
      <line x1="72" y1="380" x2="880" y2="380" stroke="rgba(38,43,56,.10)" stroke-width="0.8"/>
      <line x1="72" y1="290" x2="880" y2="290" stroke="rgba(38,43,56,.08)" stroke-width="0.8"/>
      <line x1="72" y1="200" x2="880" y2="200" stroke="rgba(38,43,56,.08)" stroke-width="0.8"/>
      <line x1="72" y1="110" x2="880" y2="110" stroke="rgba(38,43,56,.08)" stroke-width="0.8"/>
      <line x1="72" y1="40"  x2="880" y2="40"  stroke="rgba(38,43,56,.06)" stroke-width="0.8"/>

      <!-- Y axis + baseline -->
      <line x1="72" y1="40" x2="72" y2="380" stroke="rgba(38,43,56,.30)" stroke-width="1"/>
      <line x1="72" y1="380" x2="880" y2="380" stroke="rgba(38,43,56,.30)" stroke-width="1"/>

      <!-- Y axis unit -->
      <text x="60" y="46" fill="rgba(38,43,56,.60)" font-size="10" font-family="'JetBrains Mono',monospace" text-anchor="end" letter-spacing="0.06em">KB</text>
      <text x="60" y="384" fill="rgba(38,43,56,.60)" font-size="10" font-family="'JetBrains Mono',monospace" text-anchor="end">0</text>

      <!-- Y axis rotated axis label -->
      <text transform="rotate(-90 26 220)" x="26" y="220" fill="rgba(38,43,56,.60)" font-size="9" font-family="'JetBrains Mono',monospace" letter-spacing="0.18em" text-anchor="middle">JS PAYLOAD · TYPICAL</text>

      <!-- Bars — width 82, pitch 130
           P1: AI Chat Widget (~400) vs FAQ Page (~2)      x=100 / x=200
           P2: AI Recommendations (~250) vs Featured List (~3)  x=330 / x=430
           P3: AI Personalization (~180) vs Session Cookie (~1)  x=560 / x=660 -->

      <!-- ── PAIR 1 ── -->
      <!-- AI Chat Widget: v=340, h=306 (accent focal) -->
      <rect x="100" y="74"  width="82" height="306" fill="rgba(155,236,0,.18)" stroke="#9BEC00" stroke-width="1.5"/>
      <text x="141" y="66" fill="#262B38" font-size="10" font-family="'JetBrains Mono',monospace" font-weight="600" text-anchor="middle">~400</text>

      <!-- FAQ Page: v=6, h=5 -->
      <rect x="200" y="375" width="82" height="5"  fill="rgba(38,43,56,.06)" stroke="rgba(38,43,56,.60)" stroke-width="1"/>
      <text x="241" y="367" fill="rgba(38,43,56,.60)" font-size="10" font-family="'JetBrains Mono',monospace" text-anchor="middle">~2</text>

      <!-- ── PAIR 2 ── -->
      <!-- AI Recommendations: v=213, h=192 -->
      <rect x="330" y="188" width="82" height="192" fill="rgba(38,43,56,.06)" stroke="#262B38" stroke-width="1.5"/>
      <text x="371" y="180" fill="#262B38" font-size="10" font-family="'JetBrains Mono',monospace" font-weight="600" text-anchor="middle">~250</text>

      <!-- Static Featured List: v=8, h=8 -->
      <rect x="430" y="372" width="82" height="8"  fill="rgba(38,43,56,.06)" stroke="rgba(38,43,56,.60)" stroke-width="1"/>
      <text x="471" y="364" fill="rgba(38,43,56,.60)" font-size="10" font-family="'JetBrains Mono',monospace" text-anchor="middle">~3</text>

      <!-- ── PAIR 3 ── -->
      <!-- AI Personalization: v=154, h=138 -->
      <rect x="560" y="242" width="82" height="138" fill="rgba(38,43,56,.06)" stroke="#262B38" stroke-width="1.5"/>
      <text x="601" y="234" fill="#262B38" font-size="10" font-family="'JetBrains Mono',monospace" font-weight="600" text-anchor="middle">~180</text>

      <!-- Session Cookie: v=4, h=3 -->
      <rect x="660" y="377" width="82" height="3"  fill="rgba(38,43,56,.06)" stroke="rgba(38,43,56,.60)" stroke-width="1"/>
      <text x="701" y="369" fill="rgba(38,43,56,.60)" font-size="10" font-family="'JetBrains Mono',monospace" text-anchor="middle">~1</text>

      <!-- Category labels under each bar (two-line) -->
      <g font-family="Satoshi,sans-serif" font-size="14" fill="#262B38" text-anchor="middle" font-weight="600">
        <text x="141" y="404">AI CHAT</text><text x="141" y="422" font-family="'JetBrains Mono',monospace" font-size="10" fill="rgba(38,43,56,.60)" font-weight="400" letter-spacing="0.08em">WIDGET</text>
        <text x="241" y="404">FAQ</text><text x="241" y="422" font-family="'JetBrains Mono',monospace" font-size="10" fill="rgba(38,43,56,.60)" font-weight="400" letter-spacing="0.08em">PAGE</text>
        <text x="371" y="404">AI PRODUCT</text><text x="371" y="422" font-family="'JetBrains Mono',monospace" font-size="10" fill="rgba(38,43,56,.60)" font-weight="400" letter-spacing="0.08em">RECS</text>
        <text x="471" y="404">STATIC</text><text x="471" y="422" font-family="'JetBrains Mono',monospace" font-size="10" fill="rgba(38,43,56,.60)" font-weight="400" letter-spacing="0.08em">FEATURED</text>
        <text x="601" y="404">AI PERSON-</text><text x="601" y="422" font-family="'JetBrains Mono',monospace" font-size="10" fill="rgba(38,43,56,.60)" font-weight="400" letter-spacing="0.08em">ALIZATION</text>
        <text x="701" y="404">SESSION</text><text x="701" y="422" font-family="'JetBrains Mono',monospace" font-size="10" fill="rgba(38,43,56,.60)" font-weight="400" letter-spacing="0.08em">COOKIE</text>
      </g>

      <!-- Pair divider hairlines -->
      <line x1="296" y1="30" x2="296" y2="440" stroke="rgba(38,43,56,.10)" stroke-width="0.8" stroke-dasharray="3 4"/>
      <line x1="526" y1="30" x2="526" y2="440" stroke="rgba(38,43,56,.10)" stroke-width="0.8" stroke-dasharray="3 4"/>
    </svg>
  </div>

  <div class="body">
    <h1><span class="hi">Weight</span>, not intelligence.</h1>
    <div class="sub">Every "AI feature" ships in kilobytes. The boring answer it replaces ships in bytes.</div>
    <div class="cite">Typical bundle sizes · gzipped · order-of-magnitude · run PageSpeed on your own site</div>
    <div class="ft">
      <span class="tick on"></span><span class="tick"></span><span class="tick"></span><span class="tick"></span><span class="tick"></span><span class="tick"></span>
    </div>
  </div>
</div>
</body>
</html>
